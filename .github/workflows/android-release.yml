name: Android Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          {
            echo "storeFile=release.keystore"
            echo "storePassword=gecis123"
            echo "keyAlias=gecis"
            echo "keyPassword=gecis123"
          } >> local.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "Gecis-v${VERSION}-arm64.apk"
          ls -lh "Gecis-v${VERSION}-arm64.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Gecis-v*-arm64.apk
          generate_release_notes: true
          name: Gecis ${{ github.ref_name }}
