name: Android Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore signing key
        env:
          GECIS_KEYSTORE_BASE64: ${{ secrets.GECIS_RELEASE_KEYSTORE_BASE64 }}
          GECIS_STORE_PASSWORD: ${{ secrets.GECIS_SIGNING_STORE_PASSWORD }}
          GECIS_KEY_ALIAS: ${{ secrets.GECIS_SIGNING_KEY_ALIAS }}
          GECIS_KEY_PASSWORD: ${{ secrets.GECIS_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$GECIS_KEYSTORE_BASE64"
          printf '%s' "$GECIS_KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "storeFile=release.keystore"
            printf 'storePassword=%s\n' "$GECIS_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$GECIS_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$GECIS_KEY_PASSWORD"
          } > local.properties

      - name: Restore native payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download android-payload -p gecis-android-payload.zip -D /tmp
          unzip -o /tmp/gecis-android-payload.zip -d .

      - name: Stage web vendor assets
        run: |
          if [ ! -f app/src/main/assets/vendor/katex/katex.min.js ]; then
            bash web/stage-assets.sh
          fi

      - name: Build release APK
        run: ./gradlew :app:lintRelease :app:assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Rename artifact
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APK="app/build/outputs/apk/release/app-release.apk"
          cp "$APK" "Gecis-v${VERSION}-arm64.apk"
          ls -lh "Gecis-v${VERSION}-arm64.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Gecis-v*-arm64.apk
          generate_release_notes: true
          name: Gecis ${{ github.ref_name }}
