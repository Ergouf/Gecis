name: Android Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          {
            echo "storeFile=release.keystore"
            echo "storePassword=gecis123"
            echo "keyAlias=gecis"
            echo "keyPassword=gecis123"
          } >> local.properties

      - name: Restore native payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download android-payload -p gecis-android-payload.zip -D /tmp
          unzip -o /tmp/gecis-android-payload.zip -d .

      - name: Stage web vendor assets
        run: |
          if [ ! -f app/src/main/assets/vendor/katex/katex.min.js ]; then
            bash web/stage-assets.sh
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Looking for APKs..."
          find app/build/outputs -type f -name "*.apk" -print -ls || true
          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          cp "$APK" "Gecis-v${VERSION}-arm64.apk"
          ls -lh "Gecis-v${VERSION}-arm64.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Gecis-v*-arm64.apk
          generate_release_notes: true
          name: Gecis ${{ github.ref_name }}
