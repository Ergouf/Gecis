<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Gecis</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />
  <style>
    :root {
      --ink: #1c1b19;
      --ink-soft: #3f3c36;
      --muted: #8a857c;
      --paper: #faf8f5;
      --panel: #ffffff;
      --line: #e8e4dc;
      --line-strong: #d9d3c8;
      --accent: #2f6b4f;
      --accent-soft: #e7f0ea;
      --user-bubble: #f0ede6;
      --danger: #a33b32;
      --shadow: 0 10px 30px rgba(28, 27, 25, 0.06);
      --radius-lg: 18px;
      --radius-md: 12px;
      --font: "PingFang SC", "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 50% -10%, #f3efe7 0%, transparent 60%),
        var(--paper);
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }

    .app { min-height: 100%; display: flex; flex-direction: column; }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 12px;
      height: calc(56px + env(safe-area-inset-top, 0px));
      padding: env(safe-area-inset-top, 0px) 16px 0;
      background: rgba(250, 248, 245, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--ink-soft);
      display: grid;
      place-items: center;
      font-size: 18px;
      line-height: 1;
    }
    .icon-btn:hover { background: #efece5; }
    .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .brand {
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    .brand span {
      display: block;
      margin-top: 1px;
      font-size: 11px;
      font-weight: 450;
      letter-spacing: 0.02em;
      color: var(--muted);
    }
    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      max-width: min(42vw, 280px);
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status[data-state="success"] { color: var(--accent); border-color: #cfe0d5; background: var(--accent-soft); }
    .status[data-state="error"] { color: var(--danger); border-color: #efd2ce; background: #fbefed; }
    .status[data-state="working"] {
      color: var(--ink-soft);
      border-color: var(--line-strong);
    }
    .status[data-state="working"]::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--accent);
      vertical-align: 1px;
      animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      .status[data-state="working"]::before { animation: none; }
    }

    .menu-wrap { position: relative; }
    .menu {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      min-width: 180px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: var(--shadow);
      display: none;
      z-index: 40;
    }
    .menu.open { display: block; }
    .menu button {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      color: var(--ink-soft);
    }
    .menu button:hover { background: #f4f1ea; }
    .menu button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .menu .sep { height: 1px; margin: 6px 8px; background: var(--line); }

    main {
      flex: 1;
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 28px 18px 140px;
    }
    .empty {
      padding: 18vh 12px 0;
      text-align: center;
    }
    .empty-mark {
      width: 48px;
      height: 48px;
      margin: 0 auto 18px;
      border-radius: 14px;
      background: linear-gradient(160deg, #2f6b4f, #1f4635);
      color: #f7f4ee;
      display: grid;
      place-items: center;
      font-weight: 700;
      letter-spacing: -0.04em;
      box-shadow: 0 12px 28px rgba(47, 107, 79, 0.22);
    }
    .empty h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 650;
      letter-spacing: -0.035em;
    }
    .empty p {
      margin: 0 auto;
      max-width: 28em;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }
    .onboard {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 28px;
    }
    .onboard-btn {
      min-height: 40px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: var(--panel);
      color: var(--ink);
      font-size: 14px;
      font-weight: 550;
    }
    .onboard-btn.primary {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--paper);
    }
    .onboard-btn:hover { filter: brightness(0.98); }
    .empty-hint {
      margin-top: 18px !important;
      font-size: 12px !important;
      color: var(--muted) !important;
    }
    .conversation {
      display: block;
      padding: 10px 12px;
      margin: 0 6px 4px;
      border-radius: 12px;
      width: calc(100% - 12px);
      border: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .conversation:hover, .conversation.current { background: #efece5; }
    .conversation-title {
      font-size: 14px;
      color: var(--ink);
      font-weight: 550;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conversation-meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 3px;
    }
    .conversation-preview {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conversation-time {
      flex: 0 0 auto;
      font-size: 11px;
      color: #b0aaa0;
    }

    .message { margin: 0 0 22px; font-size: 15px; line-height: 1.72; }
    .message.user { display: flex; justify-content: flex-end; }
    .message.user .bubble {
      max-width: 84%;
      padding: 11px 14px;
      background: var(--user-bubble);
      border-radius: 16px 16px 5px 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .message.assistant .bubble {
      max-width: 100%;
      overflow-wrap: anywhere;
    }
    .message.assistant .bubble > :first-child { margin-top: 0; }
    .message.assistant .bubble > :last-child { margin-bottom: 0; }
    .assistant p { margin: 0.45em 0 0.95em; }
    .assistant h1, .assistant h2, .assistant h3 {
      line-height: 1.28;
      letter-spacing: -0.02em;
      margin: 1.2em 0 0.5em;
    }
    .assistant ul, .assistant ol { padding-left: 1.35em; margin: 0.5em 0 0.95em; }
    .assistant blockquote {
      margin: 0.8em 0;
      padding: 0.15em 0 0.15em 12px;
      border-left: 2px solid var(--line-strong);
      color: var(--ink-soft);
    }
    .assistant code {
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 0.9em;
      background: #f0ebe3;
      border-radius: 5px;
      padding: 0.12em 0.34em;
    }
    .assistant pre {
      margin: 0.85em 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f4f1ea;
      overflow: auto;
    }
    .assistant pre code { background: transparent; padding: 0; }
    .assistant table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.9em 0;
      display: block;
      overflow-x: auto;
    }
    .assistant th, .assistant td {
      border-bottom: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
    }
    .assistant a { color: #245a86; text-underline-offset: 2px; }
    .assistant img { max-width: 100%; border-radius: 10px; }
    .assistant .katex-display { overflow-x: auto; overflow-y: hidden; padding: 6px 0; }
    .assistant.pending .bubble::after {
      content: "";
      display: inline-block;
      width: 7px;
      height: 1em;
      margin-left: 4px;
      background: #b7b1a6;
      vertical-align: -2px;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .assistant.pending .bubble::after { animation: none; }
    }

    .composer-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      padding: 18px 14px calc(16px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(180deg, rgba(250,248,245,0) 0%, var(--paper) 28%, var(--paper) 100%);
    }
    .composer {
      width: min(760px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 10px 10px 10px 16px;
      background: var(--panel);
      border: 1px solid var(--line-strong);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }
    .composer:focus-within {
      border-color: #c5d8cc;
      box-shadow: 0 0 0 3px rgba(47, 107, 79, 0.12), var(--shadow);
    }
    .composer textarea {
      flex: 1;
      border: 0;
      outline: 0;
      resize: none;
      min-height: 28px;
      max-height: 160px;
      padding: 6px 0;
      background: transparent;
      line-height: 1.45;
    }
    .send {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border: 0;
      border-radius: 12px;
      background: var(--ink);
      color: #faf8f5;
      display: grid;
      place-items: center;
      font-size: 18px;
    }
    .send:disabled { opacity: 0.35; cursor: not-allowed; }
    .send:not(:disabled):hover { background: #2a2824; }
    .send:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .drawer-scrim {
      position: fixed;
      inset: 0;
      background: rgba(28, 27, 25, 0.18);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }
    .drawer-scrim.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: min(86vw, 320px);
      background: var(--paper);
      border-right: 1px solid var(--line);
      z-index: 51;
      transform: translateX(-102%);
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
      box-shadow: 16px 0 40px rgba(28, 27, 25, 0.08);
    }
    .drawer.open { transform: translateX(0); }
    @media (prefers-reduced-motion: reduce) {
      .drawer, .drawer-scrim { transition: none; }
    }
    .drawer-head {
      height: 58px;
      display: flex;
      align-items: center;
      padding: 0 12px 0 18px;
      border-bottom: 1px solid var(--line);
    }
    .drawer-title { font-weight: 650; letter-spacing: -0.02em; }
    .drawer-actions { margin-left: auto; display: flex; gap: 4px; }
    .project-list { overflow: auto; padding: 14px 10px 24px; }
    .project { margin-bottom: 14px; }
    .project-head {
      display: flex;
      align-items: center;
      height: 32px;
      padding: 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .project-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-new-chat {
      margin-left: auto;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
    }
    .project-new-chat:hover { background: #efece5; }
    .project-empty { padding: 6px 10px; color: #b0aaa0; font-size: 13px; }

    @media (max-width: 420px) {
      header { padding-left: 10px; padding-right: 10px; gap: 8px; }
      .brand span { display: none; }
      .status { max-width: 34vw; padding: 5px 8px; font-size: 11px; }
      .menu { min-width: 160px; right: -4px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <button class="icon-btn" id="historyTrigger" type="button" aria-label="打开会话列表">☰</button>
    <div class="brand">Gecis<span>本地学习助手</span></div>
    <div class="header-right">
      <div class="status" id="status" data-state="idle">就绪</div>
      <div class="menu-wrap">
        <button class="icon-btn" id="btnMenu" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="更多操作">⋯</button>
        <div class="menu" id="menu" role="menu">
          <button type="button" data-action="importFenbi" role="menuitem">导入题库</button>
          <button type="button" data-action="resumeConversation" role="menuitem">续聊会话</button>
          <button type="button" data-action="copyId" role="menuitem">复制会话 ID</button>
          <div class="sep"></div>
          <button type="button" data-action="exportMd" role="menuitem">导出 Markdown</button>
          <button type="button" data-action="exportHtml" role="menuitem">导出 HTML</button>
          <div class="sep"></div>
          <button type="button" data-action="login" role="menuitem">登录账号</button>
        </div>
      </div>
    </div>
  </header>

  <main id="messages"></main>

  <div class="composer-wrap">
    <form id="form" class="composer">
      <textarea id="input" rows="1" placeholder="问一道题、一个概念，或让它解释公式…"></textarea>
      <button id="send" class="send" type="submit" aria-label="发送">↑</button>
    </form>
  </div>
</div>

<div class="drawer-scrim" id="drawerScrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div class="drawer-title">会话</div>
    <div class="drawer-actions">
      <button class="icon-btn" id="newProject" type="button" title="新建项目">＋</button>
      <button class="icon-btn" id="closeDrawer" type="button" title="关闭">×</button>
    </div>
  </div>
  <div class="project-list" id="projectList"></div>
</aside>

<script src="vendor/dompurify/purify.min.js"></script>
<script src="vendor/marked/marked.umd.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/auto-render.min.js"></script>
<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
