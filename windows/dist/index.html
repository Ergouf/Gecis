<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gecis</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f7f7f5}
    *{box-sizing:border-box}html,body{background:#f7f7f5;height:100%}body{margin:0}
    button,input,textarea{font:inherit}.app{min-height:100vh;display:flex;flex-direction:column}
    header{height:54px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #e8e8e4;background:rgba(247,247,245,.95);position:sticky;top:0;z-index:20}
    .history-trigger{width:36px;height:36px;border:0;background:transparent;color:#292929;border-radius:11px;display:grid;place-items:center;font-size:20px;padding:0;margin-right:2px;cursor:pointer}.history-trigger:hover{background:#e9e9e5}
    .brand{font-size:18px;font-weight:650;letter-spacing:-.02em}.status{margin-left:auto;font-size:12px;color:#777;max-width:min(58vw,460px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .status[data-state="success"]{color:#327a4a}.status[data-state="error"]{color:#aa3a3a}.status[data-state="working"]::before{content:"";display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:currentColor;vertical-align:1px;animation:pulse 1.1s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.25}}
    main{flex:1;width:min(760px,100%);margin:0 auto;padding:22px 18px 130px}
    .message{margin:0 0 26px;line-height:1.72;font-size:16px}.user{display:flex;justify-content:flex-end}
    .user .bubble{max-width:82%;background:#e9e9e5;border-radius:20px 20px 5px 20px;padding:11px 15px;white-space:pre-wrap;overflow-wrap:anywhere}
    .assistant .bubble{max-width:100%;overflow-wrap:anywhere}.assistant .bubble>:first-child{margin-top:0}.assistant .bubble>:last-child{margin-bottom:0}
    .assistant p{margin:.4em 0 1em}.assistant h1,.assistant h2,.assistant h3{line-height:1.3;letter-spacing:-.025em;margin:1.25em 0 .55em}.assistant h1{font-size:1.55em}.assistant h2{font-size:1.3em}.assistant h3{font-size:1.12em}
    .assistant ul,.assistant ol{padding-left:1.4em;margin:.55em 0 1em}.assistant li{margin:.2em 0}
    .assistant blockquote{margin:.75em 0 1em;padding:.1em 0 .1em 14px;border-left:3px solid #d2d2cc;color:#626262}
    .assistant code{font-family:Consolas,"Cascadia Mono",monospace;font-size:.88em;background:#ecece8;border-radius:6px;padding:.13em .34em}
    .assistant pre{margin:.8em 0 1.1em;padding:13px 14px;border:1px solid #e0e0db;border-radius:12px;background:#efefeb;overflow:auto;line-height:1.55}.assistant pre code{background:transparent;padding:0;white-space:pre}
    .assistant table{width:100%;border-collapse:collapse;margin:.9em 0 1.1em;display:block;overflow-x:auto}.assistant th,.assistant td{border-bottom:1px solid #deded9;padding:8px 12px;text-align:left;white-space:nowrap}.assistant th{font-weight:650}
    .assistant a{color:#2d5c96;text-decoration-thickness:1px;text-underline-offset:2px}.assistant hr{border:0;border-top:1px solid #deded9;margin:1.4em 0}
    .assistant .katex-display{overflow-x:auto;overflow-y:hidden;padding:8px 0}.assistant .katex{font-size:1.04em}
    .assistant.pending .bubble:not(:empty)::after{content:"";display:inline-block;width:6px;height:1em;margin-left:4px;background:#777;vertical-align:-2px;animation:blink 1s steps(1) infinite}
    .assistant.pending .bubble:empty::after{content:"";display:inline-block;width:6px;height:1em;background:#777;vertical-align:-2px;animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .composer-wrap{position:fixed;left:0;right:0;bottom:0;padding:12px 14px;background:linear-gradient(transparent,#f7f7f5 24%,#f7f7f5);z-index:10}
    .composer{width:min(760px,100%);margin:0 auto;background:white;border:1px solid #deded9;border-radius:24px;padding:9px 10px 9px 16px;display:flex;align-items:flex-end;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.07)}
    textarea{flex:1;resize:none;border:0;outline:0;line-height:1.45;max-height:160px;min-height:28px;padding:5px 0;background:transparent;color:#171717}
    .send{width:38px;height:38px;flex:0 0 38px;border:0;border-radius:50%;background:#171717;color:white;font-size:20px;display:grid;place-items:center;cursor:pointer}.send:disabled{opacity:.3}
    .empty{padding-top:15vh;text-align:center}.empty h1{font-size:30px;margin:0 0 10px;letter-spacing:-.04em}.empty p{color:#777;margin:0}
    .drawer-scrim{position:fixed;inset:0;background:rgba(0,0,0,.16);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s ease}.drawer-scrim.open{opacity:1;pointer-events:auto}
    .drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,340px);background:#f7f7f5;z-index:41;transform:translateX(-102%);transition:transform .2s ease;box-shadow:12px 0 34px rgba(0,0,0,.1);display:flex;flex-direction:column}.drawer.open{transform:translateX(0)}
    .drawer-head{height:58px;display:flex;align-items:center;padding:0 14px 0 18px;border-bottom:1px solid #e5e5e0}.drawer-title{font-weight:680;letter-spacing:-.02em}.drawer-actions{margin-left:auto;display:flex;gap:4px}.drawer-icon{width:34px;height:34px;border:0;border-radius:10px;background:transparent;color:#333;font-size:20px;cursor:pointer}.drawer-icon:hover{background:#e9e9e5}
    .project-list{overflow:auto;padding:12px 10px 24px}.project{margin-bottom:12px}.project-head{display:flex;align-items:center;height:34px;padding:0 8px;color:#6c6c6c;font-size:12px;font-weight:650}.project-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-new-chat{margin-left:auto;width:28px;height:28px;border:0;background:transparent;border-radius:8px;color:#777;font-size:18px;cursor:pointer}
    .conversation{width:100%;display:block;border:0;background:transparent;text-align:left;border-radius:10px;padding:9px 10px;color:#292929;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.conversation:hover,.conversation.current{background:#e9e9e5}.project-empty{padding:7px 10px;color:#a0a0a0;font-size:13px}
  </style>
</head>
<body>
<div class="app">
  <header>
    <button class="history-trigger" id="historyTrigger" type="button" aria-label="历史记录">☰</button>
    <div class="brand">Gecis</div>
    <div class="status" id="status" data-state="idle">本地学习助手</div>
  </header>
  <main id="messages"></main>
  <div class="composer-wrap">
    <form id="form" class="composer">
      <textarea id="input" rows="1" placeholder="问一道题、一个概念，或让它解释公式…"></textarea>
      <button id="send" class="send" type="submit" aria-label="发送">↑</button>
    </form>
  </div>
</div>
<div class="drawer-scrim" id="drawerScrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div class="drawer-title">对话</div>
    <div class="drawer-actions">
      <button class="drawer-icon" id="newProject" type="button" title="新建项目">＋</button>
      <button class="drawer-icon" id="closeDrawer" type="button" title="关闭">×</button>
    </div>
  </div>
  <div class="project-list" id="projectList"></div>
</aside>
<script src="vendor/dompurify/purify.min.js"></script>
<script src="vendor/marked/marked.umd.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/auto-render.min.js"></script>
<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
