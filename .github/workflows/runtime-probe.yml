name: Runtime probe

on:
  pull_request:
    paths:
      - 'native/**'
      - 'web/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/runtime-probe.yml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe-and-build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install native probe tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils dpkg-dev patchelf

      - name: Stage local WebView renderer
        run: bash web/stage-assets.sh

      - name: Probe pinned runtime
        run: bash native/probe-runtime.sh

      - name: Stage Android native runtime
        run: bash native/stage-runtime.sh

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload build manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-manifests
          path: |
            web/.stage/web-assets-manifest.json
            native/.probe/runtime-probe.json
            native/.probe/oauth-markers.txt
            native/.probe/staged-runtime-manifest.json
            native/.probe/needed-libs.txt
            native/.probe/found-libs.txt
            native/.probe/missing-libs.txt
            native/.probe/unresolved-staged-needed.txt
            native/.probe/resolver-patch.txt
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gecis-debug-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish tagged APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          asset="Gecis-${TAG_NAME}-arm64.apk"
          cp "$apk" "$asset"

          prerelease_args=()
          if [[ "$TAG_NAME" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$asset" --clobber
          else
            gh release create "$TAG_NAME" "$asset" --generate-notes "${prerelease_args[@]}"
          fi
