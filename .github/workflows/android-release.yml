name: Cross-platform Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Restore release keystore
        env:
          GECIS_RELEASE_KEYSTORE_BASE64: ${{ secrets.GECIS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$GECIS_RELEASE_KEYSTORE_BASE64" ]; then
            echo "Missing GitHub Actions secret: GECIS_RELEASE_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$GECIS_RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore

      - name: Restore native payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download android-payload -p gecis-android-payload.zip -D /tmp
          unzip -o /tmp/gecis-android-payload.zip -d .

      - name: Stage web vendor assets
        run: |
          if [ ! -f app/src/main/assets/vendor/katex/katex.min.js ]; then
            bash web/stage-assets.sh
          fi

      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_GECIS_SIGNING_STORE_FILE: release.keystore
          ORG_GRADLE_PROJECT_GECIS_SIGNING_STORE_PASSWORD: ${{ secrets.GECIS_SIGNING_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_GECIS_SIGNING_KEY_ALIAS: ${{ secrets.GECIS_SIGNING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_GECIS_SIGNING_KEY_PASSWORD: ${{ secrets.GECIS_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:lintRelease :app:assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$APK" ]; then
            echo "Expected signed release APK not found: $APK" >&2
            find app/build/outputs -type f -name "*.apk" -print || true
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Rename artifact
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APK="app/build/outputs/apk/release/app-release.apk"
          cp "$APK" "Gecis-v${VERSION}-arm64.apk"
          ls -lh "Gecis-v${VERSION}-arm64.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Gecis-v*-arm64.apk
          generate_release_notes: true
          name: Gecis ${{ github.ref_name }}

  windows:
    needs: apk
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - name: Stage shared web assets
        shell: bash
        run: bash web/stage-assets.sh

      - name: Install Windows dependencies
        working-directory: windows
        run: npm ci

      - name: Build NSIS installer
        working-directory: windows
        run: npx tauri build --bundles nsis

      - name: Prepare Windows artifact
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          $installer = Get-ChildItem -Path "windows/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $target = "Gecis-v$version-windows-x64-setup.exe"
          Copy-Item $installer.FullName $target
          Get-Item $target | Format-List Name,Length,FullName

      - name: Upload Windows installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Gecis-v*-windows-x64-setup.exe
          name: Gecis ${{ github.ref_name }}
