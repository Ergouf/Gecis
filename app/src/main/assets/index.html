<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Gecis</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f7f7f5}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7f7f5}
    .app{min-height:100vh;display:flex;flex-direction:column}
    header{height:58px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #e8e8e4;background:rgba(247,247,245,.95);position:sticky;top:0;z-index:2}
    .brand{font-size:18px;font-weight:650;letter-spacing:-.02em}.status{margin-left:auto;font-size:12px;color:#777}
    main{flex:1;width:min(760px,100%);margin:0 auto;padding:26px 18px 130px}
    .message{margin:0 0 26px;line-height:1.72;font-size:16px}.user{display:flex;justify-content:flex-end}
    .user .bubble{max-width:82%;background:#e9e9e5;border-radius:20px 20px 5px 20px;padding:11px 15px;white-space:pre-wrap}
    .assistant .bubble{max-width:100%;white-space:pre-wrap}.assistant .katex-display{overflow-x:auto;overflow-y:hidden;padding:8px 0}
    .assistant.pending .bubble::after{content:"";display:inline-block;width:6px;height:1em;margin-left:4px;background:#777;vertical-align:-2px;animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .composer-wrap{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#f7f7f5 24%,#f7f7f5)}
    .composer{width:min(760px,100%);margin:0 auto;background:white;border:1px solid #deded9;border-radius:24px;padding:9px 10px 9px 16px;display:flex;align-items:flex-end;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.07)}
    textarea{flex:1;resize:none;border:0;outline:0;font:inherit;line-height:1.45;max-height:160px;min-height:28px;padding:5px 0;background:transparent;color:#171717}
    button{width:38px;height:38px;border:0;border-radius:50%;background:#171717;color:white;font-size:20px;display:grid;place-items:center}button:disabled{opacity:.3}
    .empty{padding-top:18vh;text-align:center}.empty h1{font-size:30px;margin:0 0 10px;letter-spacing:-.04em}.empty p{color:#777;margin:0}
  </style>
</head>
<body>
<div class="app">
  <header><div class="brand">Gecis</div><div class="status" id="status">本地学习助手</div></header>
  <main id="messages"><section id="empty" class="empty"><h1>想学什么？</h1><p>直接提问。支持 Markdown 与数学公式。</p></section></main>
  <div class="composer-wrap"><form id="form" class="composer"><textarea id="input" rows="1" placeholder="问一道题、一个概念，或让它解释公式…"></textarea><button id="send" type="submit" aria-label="发送">↑</button></form></div>
</div>
<script>
const messages=document.getElementById('messages');
const empty=document.getElementById('empty');
const form=document.getElementById('form');
const input=document.getElementById('input');
const send=document.getElementById('send');
const status=document.getElementById('status');
let active=null;
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function renderMath(node){
  if(!window.renderMathInElement)return;
  renderMathInElement(node,{delimiters:[
    {left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},
    {left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}
  ],throwOnError:false});
}
function renderText(node,text){node.innerHTML=escapeHtml(text).replace(/\n/g,'<br>');renderMath(node);}
function addMessage(role,text,requestId){
  empty?.remove();
  const row=document.createElement('section');row.className=`message ${role}`;if(requestId)row.dataset.requestId=requestId;
  const bubble=document.createElement('div');bubble.className='bubble';renderText(bubble,text);
  row.appendChild(bubble);messages.appendChild(row);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});return row;
}
function beginAssistant(requestId){
  const row=addMessage('assistant','',requestId);row.classList.add('pending');
  active={requestId,row,bubble:row.querySelector('.bubble'),text:''};return active;
}
function finish(){send.disabled=false;status.textContent='本地学习助手';input.focus();}
window.GecisChat={
  onNativeEvent(event){
    if(!active||event.requestId!==active.requestId)return;
    if(event.type==='delta'){
      active.text+=event.text;renderText(active.bubble,active.text);window.scrollTo({top:document.body.scrollHeight});return;
    }
    active.row.classList.remove('pending');
    if(event.type==='complete'){
      active.text=event.text||active.text;renderText(active.bubble,active.text);
    }else if(event.type==='error'){
      active.text='发生错误：'+event.text;renderText(active.bubble,active.text);
    }
    active=null;finish();
  }
};
form.addEventListener('submit',e=>{
  e.preventDefault();const text=input.value.trim();if(!text||active)return;
  const requestId=(crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`);
  addMessage('user',text);input.value='';input.style.height='auto';send.disabled=true;status.textContent='正在思考…';beginAssistant(requestId);
  try{
    if(!window.GecisNative?.sendMessage)throw new Error('原生 AI 桥尚未连接');
    window.GecisNative.sendMessage(requestId,text);
  }catch(err){window.GecisChat.onNativeEvent({type:'error',requestId,text:err.message});}
});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px';});
</script>
</body>
</html>
